<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rapid Rush White Water Adventures to plan your next thrilling rafting experience, ask questions, or learn more about our exciting river adventures.">
    <meta name="author" content="Collins Osim">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | Rapid Rush White Water Adventures</title>
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpeg" alt="Site Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <section class="contact-header">
            <h1> White Water Rafting Company</h1>
            <address>
                Jabi White Water<br>
                Alex Ekwueme Way<br>
                Jabi, Abuja 900108<br>
                Federal Capital Territory, Nigeria<br>
                +234 706 253 5368<br>
                info@rapidrush.com

            </address>

            <div class="contact-section">
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3939.9211424340083!2d7.412172173673613!3d9.070948788333673!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x104e751fdb7437d5%3A0xf33ed75ea0737a5d!2sJabi%20Lake%20Park%20Abuja!5e0!3m2!1sen!2sng!4v1791210208686!5m2!1sen!2sng"
                      width="600" height="450" allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin">
                    </iframe>
                </div>

                <form class="contact-form">
                    <div class="form-item">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>

                    <div class="form-item">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-item">
                        <p>Purpose of Message:</p>

                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general">
                            General Inquiry
                        </label>

                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation">
                            Reservation Question
                        </label>

                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose"
                              value="suggestion">
                            Website Suggestion
                        </label>
                    </div>

                    <div class="form-item">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <div class="form-item.column1">
                        <label for="subscribe">
                            <input type="checkbox" id="subscribe" name="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Send Message</button>

                </form>
            </div>

            <section class="employee-section">
                <h2>We Are Here to Serve You</h2>
                <div class="employee-profiles">
                    <figure>
                        <img src="images/ceo.jpg" alt="Collins Osim">
                        <figcaption>
                            Collins Osim <br>
                            Chief Executive Officer (CEO)
                        </figcaption>
                    </figure>

                    <figure>
                        <img src="images/operations-manager.jpg" alt="Operations Manager">
                        <figcaption>
                            Gloria Isah<br>
                            Operations Manager
                        </figcaption>
                    </figure>

                    <figure>
                        <img src="images/head-rafting-guide.jpg" alt="Head Rafting Guide">
                        <figcaption>
                            Louis Osim<br>
                            Head Rafting Guide
                        </figcaption>
                    </figure>
                </div>
            </section>
        </section>
    </main>
    <footer>
        <div>
            <p>&copy; 2026, Rapid Rush Adventures, Collins Osim </p>
            <nav class="socialmedia">
                <a href="https://facebook.com"><img src="images/facebook2.jpg" width="50"
                      alt="Facebook Icon"></a>
                <a href="https://www.youtube.com"><img src="images/youtube.jpg" width="50"
                      alt="YouTube Icon"></a>
                <a href="https://linkedin.com"><img src="images/linkedin.jpg" width="50"
                      alt="Linkedin Icon "></a>
            </nav>
        </div>
    </footer>
</body>

</html>
